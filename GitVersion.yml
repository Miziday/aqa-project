workflow: GitHubFlow/v1
tag-prefix: '[vV]?'

# Стартовая версия, пока в репозитории нет ни одного тега версии (v1.0.0 и т.п.).
# После создания первого тега эту строку можно удалить.
next-version: 1.0.0

# main (на теге v1.0.0)       -> 1.0.0
# main (1 коммит после тега)  -> 1.0.1-1
# feature/login               -> 1.0.1-login.1
# любая другая дочерняя ветка -> 1.0.1-<имя-ветки>.1   (слэши заменяются на '-')
